<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - ProServe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    background: #f4f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CARD */
.pass-card {
    max-width: 500px;
    margin: 50px auto;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

.title {
    text-align: center;
    font-weight: 700;
    margin-bottom: 25px;
}

/* INPUT */
.form-control {
    border-radius: 10px;
    padding: 12px;
}

/* BUTTON */
.btn-update {
    width: 100%;
    border-radius: 10px;
    font-weight: 600;
}

/* MOBILE */
@media(max-width:576px){
    .pass-card{
        margin:20px;
        padding:20px;
    }
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
    <a href="profile.html" class="navbar-brand fw-bold">← Back</a>
</nav>

<div class="pass-card">

    <h3 class="title">Change Password</h3>

    <form id="passwordForm">

        <!-- OLD PASSWORD -->
        <div class="mb-3">
            <label class="form-label">Old Password</label>
            <input type="password" id="oldPassword" class="form-control" required>
        </div>

        <!-- NEW PASSWORD -->
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-control" required minlength="6">
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" required>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn btn-primary btn-update">
            <i class="fas fa-lock me-1"></i> Update Password
        </button>

    </form>

</div>

<script src="/js/api.js"></script>

<script>

// HANDLE SUBMIT
document.getElementById("passwordForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const oldPassword = document.getElementById("oldPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // VALIDATION
    if(newPassword.length < 6){
        return Swal.fire("Error", "Password must be at least 6 characters", "error");
    }

    if(newPassword !== confirmPassword){
        return Swal.fire("Error", "Passwords do not match", "error");
    }

    try {

        const res = await apiFetch('/users/me/change-password', {
            method: 'PUT',
            body: {
                oldPassword,
                newPassword
            }
        });

        Swal.fire({
            title: "Success",
            text: res.message || "Password updated successfully",
            icon: "success"
        }).then(()=>{
            window.location.href = "profile.html";
        });

    } catch (err) {

        Swal.fire({
            title: "Error",
            text: err.message || "Failed to update password",
            icon: "error"
        });

    }
});

</script>

</body>
</html>
